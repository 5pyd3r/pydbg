[build-system]
requires = ["meson-python>=0.15.0", "cython>=3.0.0"]
build-backend = "mesonpy"

[project]
name = "pydbg"
version = "0.1.0"
description = "Windows二进制调试器"
readme = "README.md"
authors = [
    {name = "5pyd3r", email = "5pyd3r@users.noreply.github.com"}
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Cython",
    "Topic :: Software Development :: Debuggers",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/5pyd3r/pydbg"
Repository = "https://github.com/5pyd3r/pydbg.git"
Issues = "https://github.com/5pyd3r/pydbg/issues"

[tool.meson-python.args]
setup = [
    '-Dbuildtype=release',
    '-Db_ndebug=if-release',
    '-Dcython_language=c'
]

[project.optional-dependencies]
dev = ["meson", "meson-python", "ninja", "cython", "pytest", "flake8",
       "capstone>=5.0", "keystone-engine>=0.9.2"]
disasm = ["capstone>=5.0"]
patch = ["keystone-engine>=0.9.2"]
