name: CI

on:
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install build deps
        run: pip install meson meson-python ninja cython flake8 'capstone>=5.0' keystone-engine

      - name: Lint
        run: flake8 src/ tests/ --max-line-length=120

      - name: Configure
        run: meson setup build --buildtype=release

      - name: Build
        run: meson compile -C build

      - name: Build 32-bit WOW64 test target
        run: powershell -ExecutionPolicy Bypass -File scripts/build-target32.ps1

      - name: Test
        run: |
          pip install -e . --no-build-isolation
          meson test -C build --print-errorlogs
